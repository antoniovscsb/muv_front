<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta  name="description"  content="Troque Aqui! - Plataforma para trocar, doar e compartilhar conhecimento.">

    <title>MUV</title>

    <link
        rel="stylesheet"
        href="/Projeto_MUV/sobre_muv/CSS/sobre.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
</head>

<body>

   
    <header class="header">

        <a
            href="#"
            class="header_logo"
            aria-label="Página inicial Troque Aqui!"
        >
            <img
                src="/Projeto_MUV/sobre_muv/img/logo_br.png"
                alt="Logo Troque Aqui!"
            >
        </a>

        <div class="header_icones">

            <a href="#" aria-label="Meu perfil">
                <i class="fa-regular fa-circle-user"></i>
            </a>

            <a href="#" aria-label="Mensagens">
                <i class="fa-brands fa-rocketchat"></i>
            </a>

            <a href="#" aria-label="Notificações">
                <i class="fa-regular fa-bell"></i>
            </a>

        </div>

    </header>


   

    <nav class="menu" aria-label="Menu principal">
      <div></div>
         <div></div>
         <div></div>
        <div class="menu_links">

            <a class="active" href="#">
                <i class="fa-solid fa-house"></i>
                <span>Início</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-layer-group"></i>
                <span>Categorias</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-mountain-city"></i>
                <span>Anúncios</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-recycle"></i>
                <span>Trocas</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-hand-holding-heart"></i>
                <span>Doações</span>
            </a>

            <a href="#">
                <i class="fa-brands fa-ubuntu"></i>
                <span>Sobre</span>
            </a>


             <a href="#">
                <i class="fa-solid fa-question"></i>
                <span>Ajuda</span>
            </a>
        </div>
        <div></div>
        <a href="#"  class="btn_Pub_Anucio"> + Publicar Anúncio</a>

    </nav>


    

    <section
        class="menu_busca"
        aria-label="Pesquisa"
    >

        <input
            type="search"
            name="busca"
            id="busca_site"
            placeholder="Digite o nome do produto..."
            aria-label="Digite o nome do produto"
        >

    </section>


    

   
    <footer class="footer">

        <div></div>

        <p>
            &copy; 2026 Troque Aqui!.
            Todos os direitos reservados.
        </p>

        <div class="footer_icones">

            <a
                href="#"
                aria-label="WhatsApp"
            >
                <i class="fa-brands fa-whatsapp"></i>
            </a>

            <a
                href="#"
                aria-label="Instagram"
            >
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a
                href="#"
                aria-label="Facebook"
            >
                <i class="fa-brands fa-facebook-f"></i>
            </a>

        </div>

    </footer>

</body>

</html>
