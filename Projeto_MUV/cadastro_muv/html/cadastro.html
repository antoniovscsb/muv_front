<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/Projeto_MUV/cadastro_muv/css/cadastro.css">
</head>
<body>
    
    <header>

    </header>

    <main class="conteudo">

        <section class="cadastro">

            <div class="nome-sobrenome">

                <div class="nome">
                    <p>Nome:</p><input type="text">
                </div>
                <div class="sobrenome">
                    <p>Sobrenome:</p><input type="text">
                </div>                
                
            </div>


            

            <p>CPF:</p><input type="number" class="input">
            <p>Telefone:</p><input type="number" class="input">
            <p>Email:</p><input type="email" class="input">
            <p>Senha:</p><input type="password" class="input">
            <p>Confirme Senha:</p><input type="password" class="input">

            <button class="botao-cadastro">Cadastre-se</button>


        </section>
        

    </main>




</body>
</html>
