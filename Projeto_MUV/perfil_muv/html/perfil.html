<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="/Projeto_MUV/perfil_muv/css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>

    <header class="cabecalho">
        
        <section class="logo">

            <img src="/Projeto_MUV/perfil_muv/img/logo_branco_canvado.png" alt="logo">

        </section>

        <nav class="icones">

            <i class="fa-regular fa-circle-user"></i>
            <i class="fa-solid fa-comment-dots"></i>
            <i class="fa-solid fa-bell"></i>

        </nav>
        


    </header>
    
    <main class="conteudo">

        <section class="card">

            <div class="profile-card">
                <!-- Background Banner e Avatar -->
                <div class="profile-header">
                    <img src="https://ui-avatars.com/api/?name=João+Silva&background=random&size=150" alt="Profile Picture" class="profile-img">
                </div>
                
                <!-- Detalhes do Perfil -->
                <div class="profile-body">
                    <h1 class="name">João Silva</h1>
                    
                    <!-- Estrelas -->
                    <div class="rating">
                        ★★★★☆ <span class="rating-number">(4.8)</span>
                    </div>
                    
                    <!-- Contatos e info -->
                    <div class="info-list">
                        <div class="info-item">
                            <span class="info-label">Email</span>
                            <span class="info-value">joao.silva@example.com</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Telefone</span>
                            <span class="info-value">(91) 98765-4321</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">CPF</span>
                            <span class="info-value">123.456.789-00</span>
                        </div>
                    </div>
                    
                    <!-- Botoes -->
                    <div class="social-links">
                        <a href="#" class="btn">Editar Informações</a>
                        <!-- <a href="#" class="btn">Mensagem</a> -->
                        <!-- <a href="#" class="btn btn-outline">Salve Contato</a> -->
                    </div>
                </div>
            </div>            


        </section>

    </main>



</body>
</html>
