<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - MUV</title>
    <link rel="stylesheet" href="/Projeto_MUV/perfil_muv/css/perfil2.css">
    <link rel="stylesheet" href="/Projeto_MUV/cabecalho_muv/css/cabecalho.css">


  
    <!-- Ícones atualizados para a versão mais estável e compatível do Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div id="cabecalho"> </div>
    <div id="pesquisa"></div>
    
    <main class="conteudo">
        <section class="card-container">
            <div class="profile-card">
                <!-- Background Banner e Avatar -->
                <div class="profile-header">
                    <img src="https://ui-avatars.com/api/?name=João+Silva&background=random&size=150" alt="Foto de Perfil de João Silva" class="profile-img">
                </div>
                
                <!-- Detalhes do Perfil -->
                <div class="profile-body">
                    <h1 class="name">João Silva</h1>
                    
                    <!-- Estrelas -->
                    <div class="rating">
                        ★★★★☆ <span class="rating-number">(4.8)</span>
                    </div>
                    
                    <!-- Contatos e info -->
                    <div class="info-list">
                        <div class="info-item">
                            <span class="info-label">Email</span>
                            <span class="info-value">joao.silva@example.com</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Telefone</span>
                            <span class="info-value">(91) 98765-4321</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">CPF</span>
                            <span class="info-value">123.456.789-00</span>
                        </div>
                    </div>
                    
                    <!-- Botões -->
                    <div class="social-links">
                        <a href="#" class="btn">Editar Informações</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

<script src="/Projeto_MUV/cabecalho_muv/js/cabecalho.js"></script>


</body>
</html>
