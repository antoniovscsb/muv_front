<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/Projeto_MUV/doacoes_muv/css/doacoes.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header class="header">

        <a href="#" class="header_logo" aria-label="Página inicial Troque Aqui!">
            <img src="/Projeto_MUV/doacoes_muv/img/logo_br.png" alt="Logo Troque Aqui!">
        </a>

        <div class="header_icones">

            <a href="#" aria-label="Meu perfil">
                <i class="fa-regular fa-circle-user"></i>
            </a>

            <a href="#" aria-label="Mensagens">
                <i class="fa-brands fa-rocketchat"></i>
            </a>

            <a href="#" aria-label="Notificações">
                <i class="fa-regular fa-bell"></i>
            </a>

        </div>

    </header>


    <!-- =========================
         MENU
    ========================== -->

    <nav class="menu" aria-label="Menu principal">
        <div></div>
        <div></div>
        <div></div>
        <div class="menu_links">

            <a href="#">
                <i class="fa-solid fa-house"></i>
                <span>Início</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-layer-group"></i>
                <span>Categorias</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-mountain-city"></i>
                <span>Anúncios</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-recycle"></i>
                <span>Trocas</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-hand-holding-heart"></i>
                <span>Doações</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-question"></i>
                <span>Ajuda</span>
            </a>
        </div>

        <a href="#" class="btn_Pub_Anucio">
            + Publicar Anúncio
        </a>

    </nav>


    <!-- =========================
         BUSCA
    ========================== -->

    <section class="menu_busca" aria-label="Pesquisa">

        <input type="search" name="busca" id="busca_site" placeholder="Digite o nome do produto..."
            aria-label="Digite o nome do produto">

    </section>



    <!-- BANNER -->

    <article class="banner">

        <img src="/Projeto_MUV/doacoes_muv/img/banner.png" alt="banner">

    </article>

    <nav class="filtrar-categoria">

        <p><strong>Filtrar por Categoria</strong></p>
        <section class="botoes-categoria">

            <button class="todos">
                <P>Todos</P>
            </button>

            <button class="roupas">
                <p>Roupas</p>
            </button>
            <button>
                <p>Eletrônicos</p>
            </button>

            <button>
                <p>Móveis</p>
            </button>

            <button>
                <p>Brinquedos</p>
            </button>

            <button>
                <p>Livros</p>
            </button>

            <button>
                <p>Eletrodomésdicos</p>
            </button>

            <button>
                <p>Outros</p>
            </button>

        </section>


    </nav>




</body>

</html>
